version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./html_public:/usr/share/nginx/html
      - ./nginx_config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - minio
    restart: unless-stopped

  watchdog_worker:
    build:
      context: ./watchdog
      dockerfile: Dockerfile
    container_name: watchdog_worker
    environment:
      - HOST_DATA_PATH=C:\Users\feffe\Desktop\potree_pipeline\data
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
